<style>
@font-face{font-display:swap;font-family:Inter;src:url('app/assets/fonts/InterVariable.ttf')}*{box-sizing:border-box}body{margin:0;background:#030a12;color:#edf4ff;font-family:Inter,Arial,sans-serif;min-height:100svh;display:flex;align-items:center;justify-content:center;flex-direction:column}button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #a4e5ff;outline-offset:3px}.screen{width:min(100%,calc((100svh - 64px)*16/9));aspect-ratio:16/9;position:relative;overflow:hidden;flex-shrink:0;background:#081827;container-type:inline-size}.wall{position:absolute;inset:-1%;background:center/cover;transition:opacity .3s;pointer-events:none}.wall.blur{filter:blur(7px);transform:scale(1.025)}.shade{position:absolute;inset:0;background:linear-gradient(0deg,#0006,transparent 60%);pointer-events:none}.screen.night .wall{filter:brightness(.58)}.screen.night .wall.blur{filter:brightness(.58) blur(7px)}.clock-block{position:absolute;left:4%;top:4%;text-shadow:0 2px 8px #000b,0 0 18px #000a}.clock{font-size:5.4cqw;font-weight:250;line-height:1.1;letter-spacing:-.2cqw}.date{font-size:1.65cqw;font-weight:650;margin-top:.7cqw}.weather{font-size:1.3cqw;margin-top:.5cqw}.top{position:absolute;right:4%;top:6%;display:flex;gap:1cqw}.round{width:3.9cqw;height:3.9cqw;border-radius:50%;background:#25364ac9;box-shadow:inset 0 0 0 1px #ffffff4a;display:grid;place-items:center}.round svg{width:2cqw;height:2cqw}.focused{outline:2px solid #b8e5ff!important;outline-offset:3px;box-shadow:0 0 18px #80cfff55!important;transform:scale(1.05)}.dock{position:absolute;bottom:7%;left:50%;transform:translateX(-50%);display:flex;gap:1.5cqw;padding:1.8cqw;border:1px solid #ffffff78;border-radius:3cqw;background:#c4d4e028;max-width:92%;align-items:center}.app{width:11.9cqw;height:6.8cqw;border-radius:1.25cqw;background:#71879f43;box-shadow:inset 0 0 0 1px #ffffff66;display:flex;align-items:center;justify-content:center;gap:.35cqw;font-size:1.5cqw;transition:transform .12s;flex-shrink:0}.yt{font-weight:800;font-stretch:condensed}.yt-play{background:#ff0015;border-radius:.65cqw;font-size:1.45cqw;padding:.1cqw .6cqw;color:white}.apple{font-size:2.7cqw;background:#89939d66}.tvapp{background:#f11725;font-size:2.3cqw}.control{background:linear-gradient(120deg,#b9d2ed,#f2eaf3);color:#263b58}.quadro{background:linear-gradient(135deg,#d0eff3,#f9f1d9);color:#48606b;font-family:Georgia}.tempo{background:#123351;flex-direction:column;font-weight:750;font-size:1.2cqw}.tempo b{font-size:2cqw}.tabbar{position:absolute;bottom:1.8%;display:flex;justify-content:center;width:100%;gap:1.3cqw}.pill{font-size:1.05cqw;background:#142a3eac;border-radius:2cqw;padding:.6cqw 1.2cqw}.panel{position:absolute;inset:1.6%;border:1px solid #759ac84a;border-radius:2cqw;background:#081827;display:grid;grid-template-columns:25% 25% 50%;overflow:hidden}.brand{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2cqw;isolation:isolate;background:radial-gradient(ellipse at 65% 30%,#006fbd66,transparent 40%),linear-gradient(140deg,#183b70,#0a2350 60%,#09213c);border-radius:2cqw;border:1px solid #8edbff66;overflow:hidden}.brand:before,.brand:after{content:'';position:absolute;z-index:-1;width:190%;height:70%;border-radius:50%;border:1px solid #7dd7ff50;background:linear-gradient(150deg,#79c9ff22,transparent 65%);transform:rotate(-24deg);left:-35%;top:-20%}.brand:after{top:65%;transform:rotate(-25deg);background:linear-gradient(140deg,transparent,#347cdd35)}.brand-art{width:72%;margin-bottom:2cqw;filter:drop-shadow(0 0 12px #20dfff88)}.brand h1{font-size:2.8cqw;margin:.7cqw 0}.brand p{color:#bdcae0;font-size:1.45cqw;margin:.4cqw}.brand small{color:#8fa9d0;font-size:1.12cqw;margin-top:1.5cqw}.categories{padding:10.8cqw 1.4cqw 0;border-right:1px solid #ffffff09}.category{display:flex;align-items:center;gap:1cqw;width:100%;padding:1.35cqw 1.1cqw;background:transparent;border-radius:.9cqw;font-size:1.15cqw;text-align:left;margin-bottom:1cqw;color:#c9d3e0}.category svg{width:1.45cqw;height:1.45cqw}.category.active{background:#ffffff10;color:#fff}.category.focused{background:#e5e7ef;color:#111;outline:0!important;transform:none;box-shadow:none!important}.settings-main{padding:3.1cqw 3.4cqw 2cqw 2cqw;overflow:auto;scrollbar-width:thin}.eyebrow{font-size:.95cqw;letter-spacing:.1cqw;color:#94b0cb}.heading{font-size:2cqw;margin:1.4cqw 0 3.3cqw}.group-title{font-size:1.45cqw;margin:0 0 .8cqw}.row{width:100%;background:transparent;display:flex;align-items:center;gap:1cqw;min-height:5.5cqw;padding:1.2cqw 1.1cqw;text-align:left;border-bottom:1px solid #ffffff0c;font-size:1.6cqw;border-radius:.7cqw}.row svg{width:1.4cqw;height:1.4cqw;color:#81d2cd;flex-shrink:0}.row .value{margin-left:auto;color:#b6bfcd;font-size:1.4cqw;white-space:nowrap}.row.focused{background:#e5e7ef;color:#15283a;transform:none;outline:0!important}.row.focused .value{color:#42556b}.row.focused svg{color:#246877}.settings-clock{position:absolute;right:3.5%;top:9%;font-size:1.15cqw}.hint{font-size:1cqw;color:#9daec2;margin-top:1.3cqw}.footer{position:absolute;bottom:2%;right:3%;font-size:.9cqw;color:#a4b8cc}.overlay{position:absolute;inset:0;background:#061322f5;padding:3cqw;display:flex;flex-direction:column;z-index:5}.overlay h2{font-size:2.5cqw;margin:0 0 .5cqw}.overlay p{font-size:1.15cqw;color:#aabfd4}.overlay-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2cqw}.back{border-radius:2cqw;padding:.8cqw 1.5cqw;background:#ffffff16;font-size:1.2cqw}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw;overflow:auto;padding:.6cqw}.tile{aspect-ratio:16/9;border-radius:1.2cqw;background:#163450;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff45}.tile img{width:100%;height:100%;object-fit:cover}.tile-label{position:absolute;bottom:0;left:0;right:0;padding:1cqw;background:linear-gradient(transparent,#000c);font-size:1.3cqw;text-align:left;padding-top:2cqw}.tile.selected:after{content:'✓';position:absolute;top:.6cqw;right:.7cqw;background:#b4e9ee;color:#102c3d;border-radius:50%;padding:.2cqw .5cqw}.simple-list{max-width:65%;margin:auto;width:100%;overflow:auto;padding:1cqw}.listbtn{display:block;width:100%;background:#24436066;border:1px solid #ffffff20;border-radius:1cqw;padding:1.3cqw;margin:.65cqw 0;text-align:left;font-size:1.5cqw}.toast{position:absolute;bottom:23%;left:50%;transform:translateX(-50%);max-width:70%;padding:1cqw 1.5cqw;background:#091c32f5;border:1px solid #a0dfff77;border-radius:1cqw;font-size:1.2cqw;z-index:20;text-align:center}.saver .clock-block{top:auto;bottom:12%;left:7%}.saver .clock{font-size:7cqw}.saver .date{font-size:1.8cqw}.saver .weather{font-size:1.5cqw}.bottom-controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px;color:#a1b6cc;font-size:12px}.bottom-controls button{background:#14283d;border:1px solid #ffffff22;border-radius:8px;padding:7px 12px}.bottom-controls .note{margin:0 12px}.portrait{display:none}.volume{width:100%;accent-color:#7fe0dc}.selected-mark{float:right;color:#8fe5de}.fast .dock,.fast .round{box-shadow:none}.fast *{transition:none!important}.wifi-off{color:#ff635c!important}@media(orientation:portrait) and (max-width:800px){.portrait{display:flex;position:fixed;inset:0;z-index:100;background:#07182bef;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;gap:14px}.portrait b{font-size:24px}.portrait button{background:#24486e;padding:12px 20px;border-radius:12px}.portrait.hidden{display:none}}@media(orientation:landscape) and (max-height:600px){body{justify-content:flex-start}.screen{width:min(100vw,calc((100svh - 48px)*16/9))}.bottom-controls{padding:4px;font-size:10px}.bottom-controls button{padding:4px 9px}.bottom-controls .note{display:none}}
</style></head>
<body>
<div class="portrait" id="portrait"><span style="font-size:64px">↻</span><b>Vire o celular para deitado</b><span>A experiência do TV LDZ foi feita para uma tela wide 16:9.<br>Use os botões abaixo da TV para navegar.</span><button id="continuePortrait">Continuar na vertical</button></div>
<main class="screen" id="screen" aria-label="Demonstração TV LDZ"></main>
<div class="bottom-controls" aria-label="Controle remoto"><button data-key="Home" title="Tela inicial">⌂ Início</button><button data-key="Escape">← Voltar</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="Enter">OK</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button id="fullscreen">⛶ Tela cheia</button><span class="note">Demo · Setas / Enter / Esc · Clique também funciona · Segure um app para editar</span></div>
<script>
'use strict';
const $=s=>document.querySelector(s), screen=$('#screen');
const paths={home:'M3 10 12 3l9 7v11h-6v-7H9v7H3Z',appearance:'M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',sound:'M4 9h4l5-4v14l-5-4H4ZM17 8q5 4 0 8',weather:'M6 18a5 5 0 0 1-1-10 7 7 0 0 1 13 1 4.5 4.5 0 0 1 0 9Z',system:'M9 3h6l1 4 4 1v7l-4 1-1 4H9l-1-4-4-1V8l4-1Zm6 9a3 3 0 1 1-6 0 3 3 0 0 1 6 0',moon:'M20 15A9 9 0 0 1 9 3a9 9 0 1 0 11 12',grid:'M3 3h6v6H3Zm12 0h6v6h-6ZM3 15h6v6H3Zm12 0h6v6h-6Z',wifi:'M2 7q10-9 20 0M5 11q7-6 14 0M8 15q4-3 8 0M12 19h.01',tv:'M3 5h18v13H3Zm3 16 2-3m8 0 2 3',globe:'M3 12h18M12 3c-7 5-7 13 0 18 7-5 7-13 0-18m9 9a9 9 0 1 1-18 0 9 9 0 0 1 18 0',check:'m4 12 5 5L20 6'};
const icon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.grid}"/></svg>`;
const tvArt=`<svg class="brand-art" viewBox="0 0 240 150" aria-label="TV LDZ"><defs><linearGradient id="glass"><stop stop-color="#a0e4ff" stop-opacity=".4"/><stop offset="1" stop-color="#105ee3" stop-opacity=".15"/></linearGradient></defs><rect x="18" y="12" width="204" height="116" rx="19" fill="url(#glass)" stroke="#7edfff" stroke-width="3"/><rect x="25" y="20" width="190" height="100" rx="13" fill="#063b7733" stroke="#c7f5ff"/><path d="M25 48Q125 70 215 27" fill="none" stroke="#93deff55" stroke-width="12"/><path d="m52 128-17 17m153-17 17 17" stroke="#8ce4ff" stroke-width="6" stroke-linecap="round"/><g fill="#eaffff"><path d="M120 43Q124 68 145 70Q124 74 120 96Q116 74 95 70Q116 68 120 43"/><path d="M88 76q2 13 14 15-12 2-14 15-2-13-14-15 12-2 14-15M157 80q2 11 12 13-10 2-12 13-2-11-12-13 10-2 12-13"/></g></svg>`;
const defaults={background:'weather',saver:'selected',blur:false,theme:'Automático',temperature:'°C',sounds:false,volume:35,weather:true,city:'São Paulo',forecast:true,language:'Português',mode:'TV LDZ',sleep:'Desligado',wifi:true,topWifi:true,shelf:['youtube','apple','tv','control','quadro','tempo']};
let prefs={...defaults};try{prefs={...defaults,...JSON.parse(localStorage.getItem('tvldz-demo')||'{}')}}catch{};
let view='home',category=0,zone='category',focusIndex=2,overlay=null,overlayReturn=null,toastTimer,rotateTimer;
const categories=[['Tela inicial','home'],['Aparência','appearance'],['Som','sound'],['Clima','weather'],['Sistema','system']];
const apps={youtube:['YouTube','yt','<span class="yt-play">▶</span>YouTube'],apple:['Apple TV','apple','tv'],tv:['TV','tvapp','▣ TV'],control:['Controle LDZ','control','◉ Controle'],quadro:['Quadro LDZ','quadro','Quadro LDZ'],tempo:['Tempo LDZ','tempo','<b>🌤</b>Tempo LDZ']};
const wallpapers=[['sunset','Paisagem do pôr do sol','sunset.jpg'],['forest','Montanhas e florestas verdes','forest.jpg'],['snow','Montanhas nevadas','snow.jpg'],['beach','Praia','beach.jpg'],['weather','Clima e horário','weather/overcast_night.jpg'],['selected','Usar o fundo do Início',null],['rotate','Alternar paisagens','forest.jpg']];
const file=(mode)=>'app/assets/wallpapers/'+(wallpapers.find(w=>w[0]===mode)?.[2]||'sunset.jpg');
function actualBackground(saver=false){let mode=saver?prefs.saver:prefs.background;if(mode==='selected')mode=prefs.background;if(mode==='rotate')return file(['sunset','forest','snow','beach'][Math.floor(Date.now()/30000)%4]);if(mode==='weather'){let h=new Date().getHours();return 'app/assets/wallpapers/weather/'+(h>=6&&h<18?'partly_cloudy_day.jpg':'overcast_night.jpg')}return file(mode)}
function save(){try{localStorage.setItem('tvldz-demo',JSON.stringify(prefs))}catch{}render()}
function notify(t){$('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=t;screen.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3600)}
function clockHTML(){return `<div class="clock-block"><div class="clock" data-clock></div><div class="date" data-date></div>${prefs.weather?`<div class="weather">☁ ${prefs.temperature==='°F'?'75°':'24°'} Nublado &nbsp; Máx. ${prefs.temperature==='°F'?'95°':'35°'} Mín. ${prefs.temperature==='°F'?'73°':'23°'}</div>`:''}</div>`}
function tick(){let d=new Date();document.querySelectorAll('[data-clock]').forEach(e=>e.textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));document.querySelectorAll('[data-date]').forEach(e=>e.textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}))}
function wall(saver=false){return `<div class="wall ${!saver&&prefs.blur&&prefs.mode!=='TV LDZ Fast'?'blur':''}" style="background-image:url('${actualBackground(saver)}')"></div><div class="shade"></div>`}
function home(){return wall()+clockHTML()+`<div class="top"><button class="round" data-action="settings" aria-label="Ajustes">${icon('system')}</button>${prefs.topWifi?`<button class="round ${prefs.wifi?'':'wifi-off'}" data-action="wifi" aria-label="Wi-Fi ${prefs.wifi?'conectado':'desconectado'}">${icon('wifi')}</button>`:''}</div><div class="dock">${prefs.shelf.map(k=>`<button class="app ${apps[k][1]}" data-app="${k}" data-action="app:${k}" aria-label="${apps[k][0]}">${apps[k][2]}</button>`).join('')}</div><div class="tabbar"><button class="pill" data-action="all">${'▦'} Todos os apps</button><button class="pill" data-action="inputs">Entradas</button><button class="pill" data-action="shortcuts">Atalhos</button></div>`}
const label=(key)=>wallpapers.find(w=>w[0]===prefs[key])?.[1]||'';
function rows(){return [
[['Início',prefs.mode,'home','mode'],['Tela de descanso','Ver agora','moon','saver'],['Prateleira','Abrir ›','grid','shelf'],['Botões do Topo','Abrir ›','grid','top'],['Botões do Controle','Abrir ›','tv','remote']],
[['Modo de fundo',label('background'),'appearance','background'],['Nitidez do fundo inicial',prefs.mode==='TV LDZ Fast'?'Nítido · Fast':prefs.blur?'Desfocado':'Nítido','appearance','blur'],['Fundo da tela de descanso',label('saver'),'moon','saverBackground'],['Temperatura',prefs.temperature,'weather','temperature'],['Tema',prefs.theme,'moon','theme']],
[['Sons de navegação',prefs.sounds?'Ligado':'Desligado','sound','sounds'],['Volume',prefs.volume+'%','sound','volume'],['Mais ajustes de Som','Abrir ›','sound','androidSound']],
[['Widget de clima',prefs.weather?'Ligado':'Desligado','weather','weather'],['Cidade',prefs.city,'globe','city'],['Previsão',prefs.forecast?'Ligado':'Desligado','weather','forecast']],
[['Atualizações','2.2.5','system','updates'],['Idioma',prefs.language,'globe','language'],['Timer de desligamento',prefs.sleep,'moon','sleep'],['Ajustes da TV','Abrir ›','system','android'],['Mais informações','Abrir ›','grid','info']]][category]}
function settings(){return `<section class="panel"><aside class="brand">${tvArt}<h1>TV LDZ</h1><p>Ajustes</p><small>2.2.5 · TCL Android TV</small></aside><nav class="categories" aria-label="Categorias">${categories.map((c,i)=>`<button class="category ${category===i?'active':''}" data-category="${i}" ${i===category?'aria-current="page"':''}>${icon(c[1])}${c[0]}</button>`).join('')}</nav><section class="settings-main"><div class="eyebrow">AJUSTES</div><h2 class="heading">Ajustes do Início</h2><h3 class="group-title">${categories[category][0]}</h3>${rows().map((r,i)=>`<button class="row" data-row="${i}" data-action="${r[3]}">${icon(r[2])}<span>${r[0]}</span><span class="value">${r[1]}</span></button>`).join('')}<p class="hint">← categorias · ↑ ↓ opções · OK abre ou altera</p></section><span class="settings-clock" data-clock></span><div class="footer">↑ ↓ Categorias &nbsp; OK Abrir &nbsp; ← Voltar</div></section>`}
function render(){clearInterval(rotateTimer);const h=new Date().getHours();screen.className='screen'+(prefs.theme==='Escuro'||prefs.theme==='Automático'&&(h<6||h>=18)?' night':'')+(prefs.mode==='TV LDZ Fast'?' fast':'')+(view==='saver'?' saver':'');screen.innerHTML=view==='settings'?settings():view==='saver'?wall(true)+clockHTML():home();if(overlay)drawOverlay();tick();bind();applyFocus();if(view==='saver'&&prefs.saver==='rotate')rotateTimer=setInterval(render,30000)}
function controls(){return [...screen.querySelectorAll(overlay?'.overlay [data-item]':view==='settings'?zone==='category'?'.category':'.row':view==='saver'?'[data-none]':'.top button,.dock button,.tabbar button')]}
function applyFocus(){screen.querySelectorAll('.focused').forEach(e=>e.classList.remove('focused'));let c=controls();focusIndex=Math.max(0,Math.min(focusIndex,c.length-1));c[focusIndex]?.classList.add('focused');c[focusIndex]?.scrollIntoView({block:'nearest',inline:'nearest'})}
function setOverlay(title,items,type='list'){overlayReturn={view,category,zone,focusIndex};overlay={title,items,type};focusIndex=0;render()}
function closeOverlay(){overlay=null;if(overlayReturn){({view,category,zone,focusIndex}=overlayReturn)}render()}
function choices(title,values,cb){setOverlay(title,values.map(v=>({label:typeof v==='string'?v:v[1],run:()=>{cb(typeof v==='string'?v:v[0]);closeOverlay()}})))}
function drawOverlay(){const el=document.createElement('section');el.className='overlay';el.setAttribute('aria-label',overlay.title);el.innerHTML=`<div class="overlay-head"><div><h2>${overlay.title}</h2><p>${overlay.type==='wallpapers'?'Escolha com as setas e confirme com OK.':'Use as setas e OK, ou toque em uma opção.'}</p></div><button class="back" data-back>← Voltar</button></div><div class="${overlay.type==='wallpapers'||overlay.type==='apps'?'grid':'simple-list'}">${overlay.items.map((item,i)=>overlay.type==='wallpapers'?`<button class="tile ${item.selected?'selected':''}" data-item="${i}"><img src="${item.image}" alt=""><span class="tile-label">${item.label}</span></button>`:`<button class="listbtn" data-item="${i}">${item.label}${item.selected?'<span class="selected-mark">✓</span>':''}</button>`).join('')}</div><p class="hint">Demonstração no navegador · as escolhas são salvas apenas neste dispositivo.</p>`;if(overlay.title==='Volume'){const range=document.createElement('input');range.type='range';range.min=0;range.max=100;range.value=prefs.volume;range.className='volume';range.setAttribute('aria-label','Volume');range.oninput=()=>{prefs.volume=+range.value;try{localStorage.setItem('tvldz-demo',JSON.stringify(prefs))}catch{}notify('Volume: '+prefs.volume+'%')};el.querySelector('.simple-list').prepend(range)}screen.append(el)}
function wallpaperPicker(key){const choices=wallpapers.filter(w=>key==='saver'||!['selected','rotate'].includes(w[0]));setOverlay(key==='saver'?'Fundo da tela de descanso':'Modo de fundo',choices.map(w=>({label:w[1],image:w[2]?file(w[0]):actualBackground(),selected:prefs[key]===w[0],run:()=>{prefs[key]=w[0];save();closeOverlay()}})),'wallpapers')}
function toggle(key){prefs[key]=!prefs[key];save()}
function cycle(key,vals){prefs[key]=vals[(vals.indexOf(prefs[key])+1)%vals.length];save()}
function appMenu(k){setOverlay(apps[k][0],['Mover para a esquerda','Mover para a direita','Desafixar da prateleira','Desinstalar aplicativo'].map((t,i)=>({label:t,run:()=>{let a=prefs.shelf.indexOf(k);if(i<2){let b=Math.max(0,Math.min(prefs.shelf.length-1,a+(i===0?-1:1)));[prefs.shelf[a],prefs.shelf[b]]=[prefs.shelf[b],prefs.shelf[a]];save();closeOverlay()}else if(i===2){prefs.shelf=prefs.shelf.filter(x=>x!==k);save();closeOverlay()}else notify('No Android, esta ação abre a confirmação de desinstalação. No demo, nenhum app é removido.')}})))}
function act(action){if(action.startsWith('app:'))return notify(apps[action.split(':')[1]][0]+' · abertura simulada no demo');switch(action){
case 'settings':view='settings';category=0;zone='category';focusIndex=0;render();break;
case 'wifi':setOverlay('Wi-Fi',[{label:prefs.wifi?'Conectado · Rede doméstica':'Wi-Fi desconectado',run:()=>{}},{label:'Simular conexão / desconexão',run:()=>{toggle('wifi');closeOverlay()}}]);break;
case 'saver':overlay=null;view='saver';focusIndex=0;render();break;
case 'background':wallpaperPicker('background');break;case 'saverBackground':wallpaperPicker('saver');break;
case 'blur':if(prefs.mode==='TV LDZ Fast')notify('O modo Fast mantém o fundo nítido para reduzir o processamento.');else toggle('blur');break;
case 'theme':cycle('theme',['Automático','Claro','Escuro']);break;case 'temperature':cycle('temperature',['°C','°F']);break;
case 'mode':choices('Tela inicial',['TV LDZ','TV LDZ Fast'],v=>{prefs.mode=v;save()});break;
case 'sounds':toggle('sounds');break;case 'weather':toggle('weather');break;case 'forecast':toggle('forecast');break;
case 'volume':setOverlay('Volume',[{label:'− Diminuir volume',run:()=>{prefs.volume=Math.max(0,prefs.volume-5);save();notify('Volume: '+prefs.volume+'%')}},{label:'+ Aumentar volume',run:()=>{prefs.volume=Math.min(100,prefs.volume+5);save();notify('Volume: '+prefs.volume+'%')}},{label:'Silenciar',run:()=>{prefs.volume=0;save();notify('Volume silenciado')}}]);break;
case 'shelf':setOverlay('Prateleira',Object.keys(apps).map(k=>({label:apps[k][0],selected:prefs.shelf.includes(k),run:()=>{prefs.shelf=prefs.shelf.includes(k)?prefs.shelf.filter(x=>x!==k):[...prefs.shelf,k];save();actRefreshShelf()}})));break;
case 'top':setOverlay('Botões do Topo',[{label:'Ajustes · sempre disponível',run:()=>notify('Ajustes permanece disponível neste demo.')},{label:'Wi-Fi',selected:prefs.topWifi,run:()=>{toggle('topWifi');closeOverlay()}}]);break;
case 'remote':choices('Botões do Controle',['Botão YouTube','Botão Netflix','Botão Prime Video'],()=>notify('No app, é possível associar este botão a um aplicativo.'));break;
case 'city':choices('Cidade',['São Paulo','Rio de Janeiro','Curitiba','Belo Horizonte','Brasília'],v=>{prefs.city=v;save()});break;
case 'language':choices('Idioma',['Português','Automático'],v=>{prefs.language=v;save()});break;
case 'sleep':choices('Timer de desligamento',['Desligado','15 minutos','30 minutos','60 minutos','90 minutos'],v=>{prefs.sleep=v;save()});break;
case 'updates':notify('Demo da versão 2.2.5 · a atualização por GitHub funciona no aplicativo Android.');break;
case 'androidSound':notify('No aplicativo, abre as configurações de som do Android.');break;case 'android':notify('No aplicativo, abre os ajustes do Android TV.');break;
case 'info':setOverlay('Mais informações',[{label:'TV LDZ · launcher para Android TV',run:()=>notify('Inspirado no Free My TV de simbasjungles. Créditos e licença no repositório.')},{label:'Integração com Controle LDZ',run:()=>notify('No Android, permite personalização da TV pelo celular após pareamento.')},{label:'Dados do demo',run:()=>notify('Clima e apps simulados. Horário real. Preferências guardadas no navegador.')},{label:'Restaurar preferências do demo',run:()=>{prefs={...defaults,shelf:[...defaults.shelf]};save();closeOverlay()}}]);break;
case 'all':setOverlay('Todos os apps',Object.keys(apps).map(k=>({label:apps[k][0],run:()=>notify(apps[k][0]+' · abertura simulada')})),'apps');break;
case 'inputs':setOverlay('Entradas',['TV ao vivo','HDMI 1','HDMI 2','HDMI 3','AV'].map(n=>({label:'▣ '+n,run:()=>notify(n+' selecionada · simulação')})),'apps');break;
case 'shortcuts':setOverlay('Atalhos',[{label:'Ajustes',run:()=>{overlay=null;act('settings')}},{label:'Tela de descanso',run:()=>act('saver')},{label:'Todos os apps',run:()=>act('all')},{label:'Wi-Fi',run:()=>act('wifi')}],'apps');break;
}}
function actRefreshShelf(){overlay.items=Object.keys(apps).map(k=>({label:apps[k][0],selected:prefs.shelf.includes(k),run:()=>{prefs.shelf=prefs.shelf.includes(k)?prefs.shelf.filter(x=>x!==k):[...prefs.shelf,k];save();actRefreshShelf()}}));render()}
function back(){if(overlay)return closeOverlay();if(view==='saver'){view='home';focusIndex=0;return render()}if(view==='settings'&&zone==='rows'){zone='category';focusIndex=category;return render()}view='home';focusIndex=0;render()}
function key(k){if(k==='Home'){view='home';overlay=null;focusIndex=0;return render()}if(k==='Escape'||k==='Backspace')return back();if(view==='saver'){view='home';render();return}let c=controls();if(k==='Enter'){c[focusIndex]?.click();return}if(k==='ContextMenu'&&!overlay&&view==='home'){let app=c[focusIndex]?.dataset.app;if(app)appMenu(app);return}if(!k.startsWith('Arrow'))return;
if(view==='settings'&&!overlay){if(zone==='category'){if(k==='ArrowDown'||k==='ArrowUp'){category=(category+(k==='ArrowDown'?1:categories.length-1))%categories.length;focusIndex=category;render()}else if(k==='ArrowRight'){zone='rows';focusIndex=0;render()}}else{if(k==='ArrowLeft')return back();if(k==='ArrowDown'||k==='ArrowUp'){focusIndex=Math.max(0,Math.min(c.length-1,focusIndex+(k==='ArrowDown'?1:-1)));applyFocus()}}return}
let grid=overlay&&['wallpapers','apps'].includes(overlay.type);let step=k==='ArrowLeft'?-1:k==='ArrowRight'?1:k==='ArrowUp'?(grid?-3:-1):(grid?3:1);if(view==='home'&&!overlay){let tops=prefs.topWifi?2:1;if(k==='ArrowUp')focusIndex=focusIndex>=tops?0:focusIndex;else if(k==='ArrowDown')focusIndex=focusIndex<tops?tops:Math.min(c.length-1,tops+prefs.shelf.length);else focusIndex=Math.max(0,Math.min(c.length-1,focusIndex+step))}else focusIndex=Math.max(0,Math.min(c.length-1,focusIndex+step));applyFocus()}
function bind(){screen.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));screen.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=+b.dataset.category;zone='rows';focusIndex=0;render()});screen.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{focusIndex=+b.dataset.item;overlay.items[focusIndex].run()});screen.querySelectorAll('[data-back]').forEach(b=>b.onclick=closeOverlay);screen.querySelectorAll('[data-app]').forEach(b=>{let timer,held=false;b.onpointerdown=()=>{held=false;timer=setTimeout(()=>{held=true;appMenu(b.dataset.app)},650)};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>clearTimeout(timer);b.addEventListener('click',e=>{if(held){e.stopImmediatePropagation();e.preventDefault()}},true);b.oncontextmenu=e=>{e.preventDefault();appMenu(b.dataset.app)}})}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','Escape','Backspace','Home','ContextMenu'].includes(e.key)){e.preventDefault();key(e.key)}});document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key));$('#continuePortrait').onclick=()=>$('#portrait').classList.add('hidden');$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{notify('Tela cheia indisponível neste navegador.')}};setInterval(tick,1000);render();
</script></body></html>
